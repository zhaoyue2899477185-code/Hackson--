<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A lightweight concept demo of a flexible-date benefit for Cathay Pacific."
    />
    <title>Cathay Pacific | Flexible Date Benefit Concept</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <div class="demo-strip">
      Concept demo · Simulated fares and payments · Not an official Cathay Pacific booking site
    </div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/home" aria-label="Cathay Pacific concept demo home">
          <span class="brand-code" aria-hidden="true">CX</span>
          <span class="brand-name">Cathay Pacific</span>
          <span class="brand-product">Flexible Date Benefit</span>
        </a>
        <nav class="header-nav" aria-label="Main navigation">
          <a class="header-nav-link" href="#/home" data-nav="home">
            <span aria-hidden="true" data-icon="home"></span>
            Home
          </a>
          <a class="header-nav-link" href="#/account" data-nav="account">
            <span aria-hidden="true" data-icon="user"></span>
            My account
          </a>
        </nav>
        <div class="header-meta">
          <span>Economy</span>
          <span>Round trip</span>
          <span class="currency-label">HKD</span>
        </div>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>
    <div id="modal-root"></div>
    <div id="live-region" class="sr-only" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
